name: Build Jarvis APK — Wake Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build-jarvis-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Check for embedded secrets and disable cloud backup
        shell: bash
        run: |
          if [ -e keys.properties ]; then
            echo 'Do not embed API credentials in the APK.' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('app/src/main/AndroidManifest.xml')
          xml = manifest.read_text(encoding='utf-8')
          old = 'android:allowBackup="true"'
          if old not in xml:
              raise SystemExit('Unexpected AndroidManifest.xml: review backup settings first')
          manifest.write_text(xml.replace(old, 'android:allowBackup="false"', 1), encoding='utf-8')
          PY

      - name: Diagnostic wake-word sensitivity and notification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/dk/foss/jarvis/wake/WakeWordService.kt')
          s = p.read_text(encoding='utf-8')
          
          def replace_once(old, new):
              global s
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one Kotlin anchor: {old[:90]!r}; got {s.count(old)}')
              s = s.replace(old, new, 1)
          
          # This is a temporary diagnostic build, not final production sensitivity.
          replace_once('private const val STRONG_THRESHOLD = 0.4f',
                       'private const val STRONG_THRESHOLD = 0.23f')
          replace_once('private const val SUSTAINED_THRESHOLD = 0.3f',
                       'private const val SUSTAINED_THRESHOLD = 0.14f')
          replace_once('private const val SMOOTHING_FRAMES = 5',
                       'private const val SMOOTHING_FRAMES = 4')
          
          # Persistent hit counter survives lock and service restart. Peak is from last 5s.
          replace_once('    private var lastTriggerAt = 0L',
          '''    private var lastTriggerAt = 0L
              private var wakeHits = 0
              private var peakInWindow = 0f
              private var latestPeak = 0f
              private var lastPeakUpdate = SystemClock.elapsedRealtime()
          
              private fun updateDiagnosticNotification() {
                  val mgr = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  mgr.notify(NOTIF_ONGOING, ongoingNotification())
              }''')
          replace_once('        super.onCreate()\n        instance = this',
          '''        super.onCreate()
                  wakeHits = getSharedPreferences("jarvis_wake_diag", Context.MODE_PRIVATE)
                      .getInt("wake_hits", 0)
                  instance = this''')
          replace_once('    private fun onScore(score: Float) {',
          '''    private fun onScore(score: Float) {
                  peakInWindow = maxOf(peakInWindow, score)
                  val sampleTime = SystemClock.elapsedRealtime()
                  if (sampleTime - lastPeakUpdate >= 5000L) {
                      latestPeak = peakInWindow
                      peakInWindow = 0f
                      lastPeakUpdate = sampleTime
                      updateDiagnosticNotification()
                  }''')
          replace_once('        cooling = true\n\n        // Free the mic',
          '''        cooling = true
                  wakeHits += 1
                  getSharedPreferences("jarvis_wake_diag", Context.MODE_PRIVATE)
                      .edit().putInt("wake_hits", wakeHits).apply()
                  latestPeak = maxOf(latestPeak, score)
                  updateDiagnosticNotification()
          
                  // Free the mic''')
          replace_once('''            .setContentTitle("Jarvis")
                      .setContentText("Listening for “Hey Jarvis”")''',
          '''            .setContentTitle("Jarvis — wake hits: $wakeHits")
                      .setContentText("Listening • last 5s peak: %.2f".format(latestPeak))''')
          p.write_text(s, encoding='utf-8')
          print('Diagnostic wake-word patch applied; hit counter persists across screen lock.')
          PY

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK for phone installation
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Xiaomi-diagnostic-v2
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
