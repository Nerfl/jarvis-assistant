name: Jarvis V6 - RHVoice Artemiy + Dmitry + V1 Wake

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-jarvis-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Restore permanent signing key
        shell: bash
        env:
          JARVIS_KEYSTORE_B64: ${{ secrets.JARVIS_KEYSTORE_B64 }}
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$JARVIS_KEYSTORE_B64" || { echo 'Missing JARVIS_KEYSTORE_B64'; exit 1; }
          test -n "$JARVIS_KEYSTORE_PASSWORD" || { echo 'Missing JARVIS_KEYSTORE_PASSWORD'; exit 1; }
          printf '%s' "$JARVIS_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/jarvis-signing.p12"
          chmod 600 "$RUNNER_TEMP/jarvis-signing.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/jarvis-signing.p12" \
            -storepass:env JARVIS_KEYSTORE_PASSWORD -alias jarvis > /dev/null
          echo 'Signing key verified'

      - name: Apply existing V1 wake diagnostics and signing
        shell: bash
        run: |
          set -e
          test ! -e keys.properties || { echo 'Do not embed API credentials'; exit 1; }
          python3 - <<'PY'
          from pathlib import Path

          def patch(s, old, new):
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'Patch mismatch ({n}): {old[:65]!r}')
              return s.replace(old, new, 1)

          def add(s, anchor, lines):
              return patch(s, anchor, anchor + '\n' + '\n'.join(lines))

          manifest = Path('app/src/main/AndroidManifest.xml')
          s = manifest.read_text(encoding='utf-8')
          manifest.write_text(patch(s, 'android:allowBackup="true"', 'android:allowBackup="false"'), encoding='utf-8')

          gradle = Path('app/build.gradle')
          s = gradle.read_text(encoding='utf-8')
          target = '    buildTypes {\n        debug {\n'
          replacement = '\n'.join([
              '    signingConfigs {',
              '        jarvis {',
              "            storeFile file(System.getenv('RUNNER_TEMP') + '/jarvis-signing.p12')",
              "            storePassword System.getenv('JARVIS_KEYSTORE_PASSWORD')",
              "            keyAlias 'jarvis'",
              "            keyPassword System.getenv('JARVIS_KEYSTORE_PASSWORD')",
              "            storeType 'PKCS12'",
              '        }',
              '    }',
              '',
              '    buildTypes {',
              '        debug {',
              '            signingConfig signingConfigs.jarvis',
              ''
          ])
          gradle.write_text(patch(s, target, replacement), encoding='utf-8')

          wake = Path('app/src/main/java/dk/foss/jarvis/wake/WakeWordService.kt')
          s = wake.read_text(encoding='utf-8')
          s = patch(s, 'STRONG_THRESHOLD = 0.4f', 'STRONG_THRESHOLD = 0.23f')
          s = patch(s, 'SUSTAINED_THRESHOLD = 0.3f', 'SUSTAINED_THRESHOLD = 0.14f')
          s = patch(s, 'SMOOTHING_FRAMES = 5', 'SMOOTHING_FRAMES = 4')

          s = patch(s,
              'WakeWordModel("jarvis", "jarvis_v2.onnx", MODEL_THRESHOLD),',
              'WakeWordModel("v2", "jarvis_v2.onnx", MODEL_THRESHOLD),\n                WakeWordModel("v1", "jarvis_v1.onnx", MODEL_THRESHOLD),')
          s = patch(s, 'e.scores.collect { onScore(it.score) }',
              'e.scores.collect { onModelScore(it.model.name, it.score) }')

          s = add(s, '    @Volatile private var paused = false', [
              '    @Volatile private var conversationClaimed = false'
          ])

          s = add(s, '    private var lastTriggerAt = 0L', [
              '    private var wakeHits = 0',
              '    private var peakV1 = 0f',
              '    private var peakV2 = 0f',
              '    private var lastV1 = 0f',
              '    private var lastV2 = 0f',
              '    private var lastSample = SystemClock.elapsedRealtime()',
              '    private fun refreshNotice() {',
              '        val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager',
              '        nm.notify(NOTIF_ONGOING, ongoingNotification())',
              '    }',
              '',
              '    private fun onModelScore(model: String, score: Float) {',
              '        if (model == "v1") {',
              '            peakV1 = maxOf(peakV1, score)',
              '            onScore(score)',
              '            return',
              '        }',
              '        if (model != "v2") return',
              '        peakV2 = maxOf(peakV2, score)',
              '        val now = SystemClock.elapsedRealtime()',
              '        if (now - lastSample >= 5000L) {',
              '            lastV1 = peakV1',
              '            lastV2 = peakV2',
              '            peakV1 = 0f',
              '            peakV2 = 0f',
              '            lastSample = now',
              '            refreshNotice()',
              '        }',
              '    }'
          ])

          s = add(s, '        super.onCreate()', [
              '        wakeHits = getSharedPreferences("jarvis_wake_diag", Context.MODE_PRIVATE).getInt("wake_hits", 0)'
          ])

          s = add(s, '        cooling = true', [
              '        wakeHits++',
              '        getSharedPreferences("jarvis_wake_diag", Context.MODE_PRIVATE)',
              '            .edit().putInt("wake_hits", wakeHits).apply()',
              '        lastV1 = maxOf(lastV1, score)',
              '        refreshNotice()'
          ])

          s = patch(s, '        pauseEngine()\n\n        val launch', '\n'.join([
              '        pauseEngine()',
              '        uiScope.launch {',
              '            delay(7000)',
              '            if (paused && !conversationClaimed) resumeEngine()',
              '        }',
              '',
              '        val launch'
          ]))

          start = s.index('    private fun ongoingNotification()')
          head, tail = s[:start], s[start:]
          tail = patch(tail, '.setContentTitle("Jarvis")',
              '.setContentTitle("Jarvis - wake hits: $wakeHits")')
          line = next((v for v in tail.splitlines() if '.setContentText("Listening for ' in v), None)
          if line is None:
              raise SystemExit('Missing notification text')
          tail = patch(tail, line,
              '            .setContentText("V2: %.2f | V1: %.2f (last 5s)".format(lastV2, lastV1))')
          s = head + tail

          s = add(s, '        fun pauseListening() {', [
              '            instance?.let { it.conversationClaimed = true }'
          ])

          s = add(s, '        fun resumeListening() {', [
              '            instance?.let { it.conversationClaimed = false }'
          ])
          wake.write_text(s, encoding='utf-8')

          vm = Path('app/src/main/java/dk/foss/jarvis/ui/ConversationViewModel.kt')
          s = vm.read_text(encoding='utf-8')
          s = patch(s,
              '                error.value = "Configure Hermes in Settings first."\n                state.value = ConvState.Idle\n                return@launch',
              '                error.value = "Configure Hermes in Settings first."\n                state.value = ConvState.Idle\n                WakeWordService.resumeListening()\n                return@launch')
          vm.write_text(s, encoding='utf-8')

          main = Path('app/src/main/java/dk/foss/jarvis/MainActivity.kt')
          s = main.read_text(encoding='utf-8')
          start = s.index('        // Actually dismiss the keyguard so the user can interact immediately.')
          end = s.index('\n    }', start)
          s = s[:start] + '        // Keep Android keyguard: do not request unlocking.' + s[end:]
          main.write_text(s, encoding='utf-8')

          print('V1 activation, V2 diagnostics, permanent signing configured')
          PY

      - name: Integrate local Dmitry voice (Android TTS fallback)
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          def patch(s, old, new):
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'V5 patch mismatch ({n}): {old[:80]!r}')
              return s.replace(old, new, 1)

          file = Path('app/src/main/java/dk/foss/jarvis/voice/TtsEngine.kt')
          s = file.read_text(encoding='utf-8')
          s = patch(s, 'import java.util.Locale', '''import java.util.Locale
          import java.io.IOException
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicLong
          import org.json.JSONObject''')
          s += r'''

          /** Dmitry Edge TTS via a local Termux HTTP service, with caller-managed fallback. */
          class LocalDmitryTts(context: Context) : TtsEngine {
              private val app = context.applicationContext
              private val main = Handler(Looper.getMainLooper())
              private val generation = AtomicLong()
              private val client = Http.base.newBuilder()
                  .connectTimeout(3, TimeUnit.SECONDS)
                  .callTimeout(35, TimeUnit.SECONDS)
                  .build()
              @Volatile private var call: okhttp3.Call? = null
              private var player: MediaPlayer? = null
              private var audioFile: File? = null

              override fun speak(text: String, onDone: () -> Unit, onError: (String) -> Unit) {
                  val id = generation.incrementAndGet()
                  val body = JSONObject().put("text", text).toString()
                  val request = Request.Builder()
                      .url("http://127.0.0.1:8765/tts")
                      .post(body.toRequestBody("application/json; charset=utf-8".toMediaType()))
                      .build()
                  val active = client.newCall(request)
                  call = active
                  Thread {
                      try {
                          active.execute().use { response ->
                              if (!response.isSuccessful) throw IOException("TTS HTTP ${response.code}")
                              val bytes = response.body?.bytes() ?: ByteArray(0)
                              if (bytes.size < 256) throw IOException("TTS returned no audio")
                              if (id != generation.get()) return@Thread
                              val file = File.createTempFile("jarvis_dmitry_", ".mp3", app.cacheDir)
                              file.writeBytes(bytes)
                              main.post {
                                  if (id == generation.get()) playFile(id, file, onDone, onError)
                                  else file.delete()
                              }
                          }
                      } catch (e: Exception) {
                          main.post {
                              if (id == generation.get()) onError(e.message ?: "Local TTS error")
                          }
                      }
                  }.start()
              }

              private fun playFile(
                  id: Long, file: File, onDone: () -> Unit, onError: (String) -> Unit
              ) {
                  if (id != generation.get()) { file.delete(); return }
                  val mp = MediaPlayer()
                  player = mp
                  audioFile = file
                  try {
                      mp.setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_ASSISTANT)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                              .build()
                      )
                      mp.setDataSource(file.absolutePath)
                      mp.setOnCompletionListener {
                          cleanPlayer()
                          if (id == generation.get()) onDone()
                      }
                      mp.setOnErrorListener { _, what, _ ->
                          cleanPlayer()
                          if (id == generation.get()) onError("Audio playback error $what")
                          true
                      }
                      mp.setOnPreparedListener {
                          if (id == generation.get()) it.start() else cleanPlayer()
                      }
                      mp.prepareAsync()
                  } catch (e: Exception) {
                      cleanPlayer()
                      if (id == generation.get()) onError(e.message ?: "Audio playback failed")
                  }
              }

              private fun cleanPlayer() {
                  val mp = player
                  player = null
                  runCatching { mp?.release() }
                  audioFile?.delete()
                  audioFile = null
              }

              override fun stop() {
                  generation.incrementAndGet()
                  call?.cancel()
                  call = null
                  cleanPlayer()
              }

              override fun shutdown() = stop()
          }
          '''
          file.write_text(s, encoding='utf-8')

          vm = Path('app/src/main/java/dk/foss/jarvis/ui/ConversationViewModel.kt')
          s = vm.read_text(encoding='utf-8')
          s = patch(s, 'import dk.foss.jarvis.voice.ElevenLabsTts',
              'import dk.foss.jarvis.voice.ElevenLabsTts\nimport dk.foss.jarvis.voice.LocalDmitryTts')
          s = patch(s, '                AndroidTts(getApplication(), languageTag = null)',
              '                LocalDmitryTts(getApplication())')
          vm.write_text(s, encoding='utf-8')

          gradle = Path('app/build.gradle')
          s = gradle.read_text(encoding='utf-8')
          s = patch(s, 'versionCode 2', 'versionCode 3')
          s = patch(s, 'versionName "0.3.0"', 'versionName "0.5.0"')
          gradle.write_text(s, encoding='utf-8')
          print('V5 Dmitry local TTS added, Android fallback preserved')
          PY

      - name: Force RHVoice Artemiy fallback and limit Dmitry timeout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def patch(text, old, new):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'V6 patch mismatch ({count}): {old[:75]!r}')
              return text.replace(old, new, 1)

          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text(encoding='utf-8')
          m = patch(m, '    <application\n', '''    <queries>
              <package android:name="com.github.olga_yakovleva.rhvoice.android" />
              <intent>
                  <action android:name="android.intent.action.TTS_SERVICE" />
              </intent>
          </queries>

              <application
          ''')
          manifest.write_text(m, encoding='utf-8')

          engine = Path('app/src/main/java/dk/foss/jarvis/voice/TtsEngine.kt')
          s = engine.read_text(encoding='utf-8')
          s = patch(s, '.callTimeout(35, TimeUnit.SECONDS)', '.callTimeout(8, TimeUnit.SECONDS)')
          s += r'''

          /** Offline male fallback. Never silently select a female Android voice. */
          class RhvoiceArtemiyTts(context: Context) : TtsEngine {
              private val main = Handler(Looper.getMainLooper())
              @Volatile private var ready = false
              @Volatile private var failed: String? = null
              private var pending: Triple<String, () -> Unit, (String) -> Unit>? = null
              private val tts = TextToSpeech(
                  context.applicationContext,
                  { status -> initializeVoice(status) },
                  "com.github.olga_yakovleva.rhvoice.android"
              )

              private fun initializeVoice(status: Int) {
                  if (status != TextToSpeech.SUCCESS) {
                      failed = "RHVoice engine unavailable"
                  } else {
                      val selected = tts.voices?.firstOrNull { voice ->
                          voice.name.contains("Artemiy", ignoreCase = true) &&
                              voice.locale.language.equals("ru", ignoreCase = true)
                      }
                      if (selected == null) {
                          failed = "RHVoice voice Artemiy not installed or not visible"
                      } else if (tts.setVoice(selected) != TextToSpeech.SUCCESS) {
                          failed = "Failed to select RHVoice Artemiy"
                      } else {
                          ready = true
                      }
                  }
                  val p = pending
                  pending = null
                  if (p != null) {
                      main.post {
                          if (ready) speak(p.first, p.second, p.third)
                          else p.third(failed ?: "RHVoice unavailable")
                      }
                  }
              }

              override fun speak(text: String, onDone: () -> Unit, onError: (String) -> Unit) {
                  failed?.let { onError(it); return }
                  if (!ready) {
                      pending = Triple(text, onDone, onError)
                      return
                  }
                  tts.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(utteranceId: String?) {}
                      override fun onDone(utteranceId: String?) = onDone()
                      @Deprecated("deprecated")
                      override fun onError(utteranceId: String?) = onError("RHVoice playback error")
                      override fun onError(utteranceId: String?, errorCode: Int) =
                          onError("RHVoice playback error $errorCode")
                  })
                  if (tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "jarvis_artemiy") ==
                      TextToSpeech.ERROR
                  ) onError("RHVoice failed to speak")
              }

              override fun stop() {
                  pending = null
                  runCatching { tts.stop() }
              }
              override fun shutdown() {
                  stop()
                  runCatching { tts.shutdown() }
              }
          }
          '''
          engine.write_text(s, encoding='utf-8')

          vm = Path('app/src/main/java/dk/foss/jarvis/ui/ConversationViewModel.kt')
          s = vm.read_text(encoding='utf-8')
          s = patch(s, 'import dk.foss.jarvis.voice.LocalDmitryTts',
                    'import dk.foss.jarvis.voice.LocalDmitryTts\nimport dk.foss.jarvis.voice.RhvoiceArtemiyTts')
          s = patch(s, 'private var androidFallback: AndroidTts? = null',
                    'private var androidFallback: RhvoiceArtemiyTts? = null')
          s = patch(s, '(tts as? AndroidTts)?.let { return it }',
                    '(tts as? RhvoiceArtemiyTts)?.let { return it }')
          s = patch(s, 'if (androidFallback == null) androidFallback = AndroidTts(getApplication(), languageTag = null)',
                    'if (androidFallback == null) androidFallback = RhvoiceArtemiyTts(getApplication())')
          s = patch(s, '''                        onError = { main.post { if (turn == myTurn) { speaking = false; pump() } } },''',
                    '''                        onError = { reason -> main.post {
                                      if (turn == myTurn) {
                                          hint.value = "RHVoice: $reason"
                                          speaking = false
                                          pump()
                                      }
                                  } },''')
          vm.write_text(s, encoding='utf-8')

          gradle = Path('app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = patch(g, 'versionCode 3', 'versionCode 4')
          g = patch(g, 'versionName "0.5.0"', 'versionName "0.6.0"')
          gradle.write_text(g, encoding='utf-8')
          print('V6: RHVoice Artemiy explicit offline fallback; Dmitry timeout 8 sec')
          PY

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed debug APK
        env:
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-V6-Dmitry-Artemiy-Signed
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
