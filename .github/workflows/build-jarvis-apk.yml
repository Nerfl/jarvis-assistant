name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build-jarvis-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Check for embedded secrets and disable cloud backup
        shell: bash
        run: |
          if [ -e keys.properties ]; then
            echo 'Do not embed API credentials in the APK.' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('app/src/main/AndroidManifest.xml')
          xml = manifest.read_text(encoding='utf-8')
          old = 'android:allowBackup="true"'
          if old not in xml:
              raise SystemExit('Unexpected AndroidManifest.xml: review backup settings first')
          manifest.write_text(xml.replace(old, 'android:allowBackup="false"', 1), encoding='utf-8')
          PY

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK for phone installation
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Xiaomi-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
