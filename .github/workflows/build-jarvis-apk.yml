
name: Build Jarvis APK - Wake Handoff V3

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-jarvis-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Apply Wake V3 fixes
        shell: bash
        run: |
          test ! -e keys.properties || { echo 'Remove keys.properties from build'; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import re

          def change(source, old, new):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Patch anchor mismatch ({count}): {old[:70]!r}')
              return source.replace(old, new, 1)

          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text()
          p.write_text(change(s, 'android:allowBackup="true"', 'android:allowBackup="false"'))

          p = Path('app/src/main/java/dk/foss/jarvis/wake/WakeWordService.kt')
          s = p.read_text()
          s = change(s, 'STRONG_THRESHOLD = 0.4f', 'STRONG_THRESHOLD = 0.23f')
          s = change(s, 'SUSTAINED_THRESHOLD = 0.3f', 'SUSTAINED_THRESHOLD = 0.14f')
          s = change(s, 'SMOOTHING_FRAMES = 5', 'SMOOTHING_FRAMES = 4')

          s = change(s, '    @Volatile private var paused = false', '''    @Volatile private var paused = false
              @Volatile private var conversationClaimed = false''')

          s = change(s, '    private var lastTriggerAt = 0L', '''    private var lastTriggerAt = 0L
              private var wakeHits = 0
              private var peakInWindow = 0f
              private var latestPeak = 0f
              private var lastPeakUpdate = SystemClock.elapsedRealtime()

              private fun updateDiag() {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.notify(NOTIF_ONGOING, ongoingNotification())
              }''')

          s = change(s, '        super.onCreate()\n        instance = this', '''        super.onCreate()
              wakeHits = getSharedPreferences("jarvis_wake_diag", Context.MODE_PRIVATE)
                  .getInt("wake_hits", 0)
              instance = this''')

          s = change(s, '    private fun onScore(score: Float) {', '''    private fun onScore(score: Float) {
              peakInWindow = maxOf(peakInWindow, score)
              val nowSample = SystemClock.elapsedRealtime()
              if (nowSample - lastPeakUpdate >= 5000L) {
                  latestPeak = peakInWindow
                  peakInWindow = 0f
                  lastPeakUpdate = nowSample
                  updateDiag()
              }''')

          s = change(s, '        cooling = true\n\n        // Free the mic', '''        cooling = true
              wakeHits++
              getSharedPreferences("jarvis_wake_diag", Context.MODE_PRIVATE)
                  .edit().putInt("wake_hits", wakeHits).apply()
              latestPeak = maxOf(latestPeak, score)
              updateDiag()

              // Free the mic''')

          s = change(s, '        pauseEngine()\n\n        val launch', '''        pauseEngine()
              uiScope.launch {
                  delay(7000)
                  if (paused && !conversationClaimed) {
                      Log.w(TAG, "Wake launch not claimed: resume microphone")
                      resumeEngine()
                  }
              }

              val launch''')

          s, n = re.subn(r'\.setContentText\("Listening for [^"\n]*"\)',
                         '.setContentText("Listening - last 5s peak: %.2f".format(latestPeak))', s)
          if n != 1:
              raise SystemExit(f'Notification text not found: {n}')

          s = change(s, '            .setContentTitle("Jarvis")\n            .setContentText("Listening - last 5s peak: %.2f".format(latestPeak))',
                         '            .setContentTitle("Jarvis - wake hits: $wakeHits")\n            .setContentText("Listening - last 5s peak: %.2f".format(latestPeak))')

          s = change(s, '        fun pauseListening() {\n            instance?.pauseEngine()\n        }', '''        fun pauseListening() {
                  instance?.conversationClaimed = true
                  instance?.pauseEngine()
              }''')

          s = change(s, '        fun resumeListening() {\n            instance?.resumeEngine()\n        }', '''        fun resumeListening() {
                  instance?.conversationClaimed = false
                  instance?.resumeEngine()
              }''')
          p.write_text(s)

          p = Path('app/src/main/java/dk/foss/jarvis/ui/ConversationViewModel.kt')
          s = p.read_text()
          s = change(s, '                error.value = "Configure Hermes in Settings first."\n                state.value = ConvState.Idle\n                return@launch', '''                error.value = "Configure Hermes in Settings first."
                state.value = ConvState.Idle
                WakeWordService.resumeListening()
                return@launch''')
          p.write_text(s)

          p = Path('app/src/main/java/dk/foss/jarvis/MainActivity.kt')
          s = p.read_text()
          s = change(s, '''        // Actually dismiss the keyguard so the user can interact immediately.
        val km = getSystemService(KEYGUARD_SERVICE) as? KeyguardManager
        km?.requestDismissKeyguard(this, object : KeyguardManager.KeyguardDismissCallback() {
            override fun onDismissSucceeded() {}
            override fun onDismissCancelled() {}
            override fun onDismissError() {}
        })''', '''        // Do not request unlocking during a wake-word test.
        // Android keyguard protection remains enabled.''')
          p.write_text(s)
          print('Wake V3 patch applied')
          PY

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Xiaomi-wake-v3
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
